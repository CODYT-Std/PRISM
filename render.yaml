services:
  - type: web
    name: stream-server
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app

    envVars:
      - key: PYTHON_VERSION
        value: 3.11

    disk:
      name: videos-disk
      mountPath: /opt/render/project/src/videos
      sizeGB: 10
